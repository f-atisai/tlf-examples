[project]
name = "population-summary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Frederick Atisai", email = "frederickatisai@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10.9", "numpy>=2.2.6", "pandas>=2.3.3"]

[project.scripts]
population-summary = "population_summary:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.8"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
ignore = []
